<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공간 질의 시험</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1f22; --muted: #6b7076; --line: #dcdcd8;
  --floor: #e9ece6; --floor-line: #cfd5cb; --obj: #8a94a3; --check: #d9822b; --cite: #2a6fdb;
  --route: #2a6fdb; --me: #c4322b; --kf: #b9bec5; --goal: #bcd3fb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17191c; --panel: #202327; --ink: #e8e9ea; --muted: #9aa0a6; --line: #34383d;
    --floor: #2a2e2a; --floor-line: #3a4039; --obj: #7d8794; --check: #e8994a; --cite: #6ea2ff;
    --route: #6ea2ff; --me: #ff6b5f; --kf: #4a4f56; --goal: #2c4a7a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, "Noto Sans KR", sans-serif; }
.wrap { display: grid; grid-template-columns: 1fr 400px; height: 100vh; }
.mapbox { position: relative; min-height: 0; }
#map { width: 100%; height: 100%; display: block; cursor: crosshair; }
.zoom { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 34px; height: 34px; padding: 0; background: var(--panel); }
.zoom button.on { background: var(--cite); color: #fff; }
.side { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; display: flex;
        flex-direction: column; gap: 12px; }
h1 { font-size: 17px; margin: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select, input, button, textarea { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
                                  border-radius: 6px; padding: 6px 10px; }
textarea { width: 100%; resize: vertical; min-height: 60px; }
button { cursor: pointer; }
button.primary { background: var(--cite); color: #fff; border-color: var(--cite); }
button:disabled { opacity: .5; cursor: wait; }
.muted { color: var(--muted); font-size: 12.5px; }
.ex { display: flex; flex-wrap: wrap; gap: 6px; }
.ex button { font-size: 12.5px; padding: 3px 8px; }
.answer { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
          min-height: 48px; }
.log .sym { color: var(--cite); font-weight: 600; cursor: pointer; }
.log { display: flex; flex-direction: column; gap: 8px; }
.log .uq { align-self: flex-end; max-width: 85%; background: var(--cite); color: #fff; border-radius: 10px 10px 2px 10px;
           padding: 6px 10px; white-space: pre-wrap; }
.log .ua { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 10px 10px 10px 2px;
           padding: 8px 10px; }
.log .ua.old { opacity: .7; }
.log .sys { align-self: center; max-width: 92%; font-size: 13px; background: var(--goal); color: var(--ink);
            border-radius: 8px; padding: 5px 10px; }
.walk { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: none; flex-direction: column; gap: 6px; }
.walk.on { display: flex; }
details { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
details pre { white-space: pre-wrap; font-size: 11.5px; max-height: 320px; overflow: auto; margin: 6px 0 0; }
#card { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        padding: 8px; max-width: 260px; font-size: 12.5px; display: none; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
#card img { width: 100%; border-radius: 4px; margin-top: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
@media (max-width: 800px) {
  .wrap { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
  .side { border-left: 0; border-top: 1px solid var(--line); padding: 16px; }
  .mapbox, #map { height: 55vh; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="mapbox"><canvas id="map"></canvas>
    <div class="zoom"><button onclick="zoom(1.3)" aria-label="확대">＋</button><button onclick="zoom(1/1.3)" aria-label="축소">－</button>
      <button onclick="home();draw()" aria-label="전체 보기">⤢</button>
      <button id="panbtn" onclick="panMode=!panMode;this.classList.toggle('on',panMode)" aria-label="지도 이동">✋</button></div></div>
  <div class="side">
    <h1>공간 질의 시험</h1>
    <div class="row">
      <label>공간 <select id="scene"></select></label>
      <span class="muted" id="status"></span>
    </div>
    <div>
      <div class="row"><b>내 위치</b> <span id="pose" class="muted">정하지 않음 (위치 없이 질문)</span>
        <button id="clear">지우기</button></div>
      <div class="muted">지도를 누른 채 끌면 위치와 바라보는 방향이 정해집니다. 확대·축소: 휠 또는 ＋/－, 이동: 오른쪽 버튼(또는 Shift)으로 끌기, 휴대폰은 ✋ 버튼을 켜고 끌기.</div>
    </div>
    <div class="log" id="log"></div>
    <div class="walk" id="walk">
      <div class="row"><b>걸으며 안내</b> <span id="walkinfo" class="muted"></span></div>
      <div class="row"><button id="play">걸어 보기</button><button id="stopwalk">멈춤</button>
        <label class="muted"><input type="checkbox" id="voice"> 음성</label></div>
      <div class="muted">지도에서 내 위치를 옮기면 그 위치에 맞춰 안내합니다.</div>
    </div>
    <textarea id="q" placeholder="예: 여기서 가장 가까운 화분까지 어떻게 가? (이어서 '거기까지 어떻게 가?'처럼 물어도 됩니다)"></textarea>
    <div class="row"><button class="primary" id="ask">질문하기</button><button id="newchat">새 대화</button>
      <span class="muted" id="time"></span></div>
    <div class="ex" id="examples"></div>
    <details><summary>도구 호출과 계산 결과</summary><pre id="trace"></pre></details>
    <div class="legend muted">
      <span><i style="background:var(--obj)"></i>물체</span>
      <span><i style="background:var(--check)"></i>점검 필요</span>
      <span><i style="background:var(--cite)"></i>답에 나온 물체·경로</span>
      <span><i style="background:var(--me)"></i>내 위치</span>
      <span><i style="background:var(--goal)"></i>목적지 구역</span>
    </div>
  </div>
</div>
<div id="card"></div>
<script>
const EX = ["지금 여기가 어디야?", "거기까지 어떻게 가?", "그 옆에 뭐가 있어?", "이 층에는 어떤 공간들이 있어?", "여기서 가장 가까운 화분까지 어떻게 가?", "내 왼쪽에 뭐가 있어?", "내 앞에 뭐가 있어?", "의자는 몇 개 있어?",
            "앉아서 쉴 수 있는 곳은 어디 있어?", "이 공간에서 정리하거나 점검하면 좋을 일 3가지 추천해줘.", "콘센트는 어디 있어?"];
const $ = id => document.getElementById(id);
const cv = $("map"), ctx = cv.getContext("2d");
let hist = [];  // this conversation: [{q, a}], the last 3 go to the server
let S = null, pose = null, route = null, goalArea = null, areaOf = {}, cited = new Set(), view = {s: 20, x: 0, y: 0}, hover = null;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dark = () => matchMedia("(prefers-color-scheme: dark)").matches;

function fit() {
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  draw();
}
function home() {
  const xs = S.places.flatMap(p => p.b.map(q => q[0])), ys = S.places.flatMap(p => p.b.map(q => q[1]));
  const r = cv.getBoundingClientRect(), w = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);
  view.s = 0.9 * Math.min(r.width / w, r.height / h);
  view.x = (Math.min(...xs) + Math.max(...xs)) / 2; view.y = (Math.min(...ys) + Math.max(...ys)) / 2;
}
// world (x right, y up) -> screen
const W2S = (x, y) => { const r = cv.getBoundingClientRect();
  return [r.width / 2 + (x - view.x) * view.s, r.height / 2 - (y - view.y) * view.s]; };
const S2W = (u, v) => { const r = cv.getBoundingClientRect();
  return [view.x + (u - r.width / 2) / view.s, view.y - (v - r.height / 2) / view.s]; };

function draw() {
  if (!S) return;
  const r = cv.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.lineWidth = 1;
  for (const p of S.places) {
    const a = areaOf[p.id];
    ctx.fillStyle = a === undefined ? css("--floor") : `hsl(${(a * 137) % 360} 45% ${dark() ? 24 : 88}%)`;
    if (goalArea !== null && a === goalArea) ctx.fillStyle = css("--goal");
    ctx.beginPath(); p.b.forEach((q, i) => { const [u, v] = W2S(q[0], q[1]); i ? ctx.lineTo(u, v) : ctx.moveTo(u, v); });
    ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = css("--floor-line");
  for (const [a, b] of S.edges) { const A = W2S(...a), B = W2S(...b); ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(...B); ctx.stroke(); }
  for (const o of S.objects) {
    const [u, v] = W2S(o.c[0], o.c[1]), w = Math.max(3, o.s[0] * view.s), h = Math.max(3, o.s[1] * view.s);
    const c = cited.has(o.sym) ? css("--cite") : o.check ? css("--check") : css("--obj");
    ctx.fillStyle = c; ctx.globalAlpha = cited.has(o.sym) || o === hover ? 0.95 : 0.55;
    ctx.fillRect(u - w / 2, v - h / 2, w, h); ctx.globalAlpha = 1;
    if (cited.has(o.sym) || o === hover) {
      ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.strokeRect(u - w / 2 - 2, v - h / 2 - 2, w + 4, h + 4);
      ctx.fillStyle = css("--ink"); ctx.font = "12px system-ui";
      ctx.fillText(o === hover ? `${o.sym} ${o.name || o.label}` : o.sym, u + w / 2 + 4, v - 4);
    }
  }
  ctx.font = "12px system-ui"; ctx.textAlign = "center";
  for (const a of S.areas || []) {
    if (!a.name || !a.c) continue;
    const [u, v] = W2S(a.c[0], a.c[1]);
    ctx.fillStyle = css("--muted"); ctx.globalAlpha = 0.9; ctx.fillText(a.name, u, v); ctx.globalAlpha = 1;
  }
  ctx.textAlign = "start";
  if (route) {
    ctx.strokeStyle = css("--route"); ctx.lineWidth = 3; ctx.setLineDash([8, 5]); ctx.beginPath();
    route.forEach((q, i) => { const [u, v] = W2S(q[0], q[1]); i ? ctx.lineTo(u, v) : ctx.moveTo(u, v); });
    ctx.stroke(); ctx.setLineDash([]);
  }
  if (pose) {
    const [u, v] = W2S(pose[0], pose[1]), a = pose[2];
    ctx.fillStyle = css("--me"); ctx.beginPath(); ctx.arc(u, v, 7, 0, 7); ctx.fill();
    ctx.strokeStyle = css("--me"); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(u, v);
    ctx.lineTo(u + 26 * Math.cos(a), v - 26 * Math.sin(a)); ctx.stroke();
  }
}

function pick(u, v) {
  let best = null, bd = 12;
  for (const o of S.objects) {
    const [x, y] = W2S(o.c[0], o.c[1]), d = Math.hypot(x - u, y - v);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}

let drag = null, panMode = false;
cv.style.touchAction = "none";
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect(), u = e.clientX - r.left, v = e.clientY - r.top;
  cv.setPointerCapture(e.pointerId);
  drag = e.button === 2 || e.shiftKey || panMode ? {pan: true, u, v, x: view.x, y: view.y} : {pan: false, w: S2W(u, v)};
  if (!drag.pan) { pose = [drag.w[0], drag.w[1], pose ? pose[2] : 0]; showPose(); draw(); }
});
cv.addEventListener("pointerup", () => { const moved = drag && !drag.pan; drag = null; if (moved && walking) followStep(); });
cv.addEventListener("pointercancel", () => { drag = null; });
cv.addEventListener("pointermove", e => {
  const r = cv.getBoundingClientRect(), u = e.clientX - r.left, v = e.clientY - r.top;
  if (drag && drag.pan) { view.x = drag.x - (u - drag.u) / view.s; view.y = drag.y + (v - drag.v) / view.s; draw(); return; }
  if (drag) {
    const [x, y] = S2W(u, v);
    if (Math.hypot(x - drag.w[0], y - drag.w[1]) > 0.2) { pose[2] = Math.atan2(y - drag.w[1], x - drag.w[0]); showPose(); draw(); }
    return;
  }
  if (e.pointerType !== "mouse") return;
  const o = pick(u, v);
  if (o !== hover) { hover = o; draw(); card(o, e); } else if (o) card(o, e);
});
function zoom(f) { view.s *= f; draw(); }
cv.addEventListener("mouseleave", () => { hover = null; $("card").style.display = "none"; draw(); });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), [x, y] = S2W(e.clientX - r.left, e.clientY - r.top);
  view.s *= e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const [x2, y2] = S2W(e.clientX - r.left, e.clientY - r.top); view.x += x - x2; view.y += y - y2; draw();
}, {passive: false});

function card(o, e) {
  const c = $("card");
  if (!o) { c.style.display = "none"; return; }
  c.innerHTML = `<b>${o.sym}</b> ${esc(o.name || "")} <span class="muted">(${esc(o.label)})</span>` +
    (o.state ? `<div>상태: ${esc(o.state)}${o.check ? " · 점검 필요" : ""}</div>` : "") +
    (o.desc ? `<div class="muted">${esc(o.desc)}</div>` : "") +
    (o.view ? `<img src="/api/view?name=${S.name}&sym=${o.sym}">` : "");
  c.style.display = "block";
  c.style.left = Math.min(innerWidth - 270, e.clientX + 14) + "px"; c.style.top = Math.min(innerHeight - 260, e.clientY + 14) + "px";
}
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[m]));

function showPose() {
  $("pose").textContent = pose ? `x ${pose[0].toFixed(1)}, y ${pose[1].toFixed(1)}, 방향 ${Math.round(pose[2] * 180 / Math.PI)}°`
                               : "정하지 않음 (위치 없이 질문)";
}
$("clear").onclick = () => { pose = null; route = null; goalArea = null; showPose(); draw(); };

async function loadScene(name) {
  $("status").textContent = "불러오는 중…";
  S = await (await fetch(`/api/scene?name=${encodeURIComponent(name)}`)).json();
  areaOf = {}; for (const a of S.areas || []) for (const p of a.places) areaOf[p] = a.id;
  pose = null; route = null; goalArea = null; cited = new Set(); newChat(); showPose(); home(); fit();
  $("status").textContent = `물체 ${S.objects.length}개, 장소 ${S.places.length}개`;
}
$("scene").onchange = e => loadScene(e.target.value);

function newChat() { setWalk(null); hist = []; $("log").innerHTML = ""; $("trace").textContent = ""; $("time").textContent = ""; }
$("newchat").onclick = () => { newChat(); route = null; goalArea = null; cited = new Set(); draw(); };
function bubble(cls, html) { const d = document.createElement("div"); d.className = cls; d.innerHTML = html;
                             $("log").appendChild(d); d.scrollIntoView({block: "nearest"}); return d; }
async function ask() {
  const q = $("q").value.trim();
  if (!q) return;
  $("ask").disabled = true; $("q").value = ""; $("trace").textContent = ""; $("time").textContent = "";
  for (const e of $("log").querySelectorAll(".ua")) e.classList.add("old");
  bubble("uq", esc(q));
  const out = bubble("ua", "생각하는 중…");
  try {
    const r = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"},
                                       body: JSON.stringify({scene: S.name, q, pose, history: hist.slice(-3)})});
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    hist.push({q, a: d.answer});
    cited = new Set(d.cited); route = d.route; goalArea = d.goal_area ?? null;
    setWalk(d.follow);
    out.innerHTML = esc(d.answer).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/O\d+/g, m => cited.has(m) ? `<span class="sym" data-s="${m}">${m}</span>` : m);
    $("trace").textContent = d.trace.map(t => `▶ ${t.tool}(${JSON.stringify(t.args)})\n${JSON.stringify(t.result, null, 1)}`).join("\n\n");
    $("time").textContent = `${d.sec}초` + (d.warning ? ` · 주의: ${d.warning}` : "");
    draw();
  } catch (e) { out.textContent = "오류: " + e.message; }
  $("ask").disabled = false;
}
// ---------------------------------------------------------------- guidance while walking
let walking = null, timer = null;
function setWalk(f) {
  stopPlay(); walking = f || null;
  $("walk").classList.toggle("on", !!walking);
  if (walking) { if (walking.route) route = walking.route; $("walkinfo").textContent = `${walking.goal}까지 ${walking.remaining_m} m`; }
}
function speak(t) {
  if (!$("voice").checked || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(t.replace(/\(O\d+\)/g, "")); u.lang = "ko-KR"; speechSynthesis.speak(u);
}
async function followStep() {
  if (!walking || !pose) return null;
  const r = await (await fetch("/api/follow", {method: "POST", headers: {"Content-Type": "application/json"},
                                               body: JSON.stringify({scene: S.name, pose})})).json();
  if (r.error) { bubble("sys", esc(r.error)); stopPlay(); return null; }
  for (const t of r.say) { bubble("sys", esc(t)); speak(t); }
  if (r.rerouted) route = r.route;
  $("walkinfo").textContent = r.arrived ? "도착" : `남은 거리 ${r.remaining_m} m` + (r.next ? ` · ${r.next.in_m} m 뒤 ${r.next.turn}` : "");
  if (r.arrived) stopPlay();
  return r;
}
function stopPlay() { if (timer) clearInterval(timer); timer = null; }
$("stopwalk").onclick = stopPlay;
$("play").onclick = () => {
  // walk along the route from the nearest point: 0.5 m per step, two steps a second
  if (!walking || !route || !pose) return;
  stopPlay();
  const pts = [];
  for (let i = 0; i + 1 < route.length; i++) {
    const [a, b] = [route[i], route[i + 1]], L = Math.hypot(b[0] - a[0], b[1] - a[1]), yaw = Math.atan2(b[1] - a[1], b[0] - a[0]);
    for (let t = 0; t < L; t += 0.5) pts.push([a[0] + (b[0] - a[0]) * t / L, a[1] + (b[1] - a[1]) * t / L, yaw]);
  }
  pts.push([...route[route.length - 1], pts.length ? pts[pts.length - 1][2] : pose[2]]);
  let k = pts.reduce((bi, p, i) => Math.hypot(p[0] - pose[0], p[1] - pose[1]) < Math.hypot(pts[bi][0] - pose[0], pts[bi][1] - pose[1]) ? i : bi, 0);
  timer = setInterval(async () => {
    if (k >= pts.length) { stopPlay(); return; }
    pose = pts[k++]; showPose(); draw();
    await followStep();
  }, 500);
};
$("ask").onclick = ask;
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });
$("log").addEventListener("click", e => {
  const s = e.target.dataset && e.target.dataset.s, o = s && S.objects.find(x => x.sym === s);
  if (o) { view.x = o.c[0]; view.y = o.c[1]; draw(); }
});
for (const t of EX) { const b = document.createElement("button"); b.textContent = t; b.onclick = () => { $("q").value = t; ask(); };
                      $("examples").appendChild(b); }
addEventListener("resize", fit);

(async () => {
  const d = await (await fetch("/api/scenes")).json();
  for (const n of d.scenes) { const o = document.createElement("option"); o.value = o.textContent = n; $("scene").appendChild(o); }
  if (!d.model) $("status").textContent = "모델 없이 실행 중";
  // ?scene=lab_03&pose=x,y,heading_deg&q=question opens that case (and asks it); &walk=1 then walks the route
  const P = new URLSearchParams(location.search), sc = P.get("scene");
  if (sc && d.scenes.includes(sc)) $("scene").value = sc;
  await loadScene($("scene").value);
  const pp = (P.get("pose") || "").split(",").map(Number);
  if (pp.length === 3 && pp.every(isFinite)) { pose = [pp[0], pp[1], pp[2] * Math.PI / 180]; showPose(); draw(); }
  if (P.get("q")) { $("q").value = P.get("q"); await ask(); if (P.get("walk") && walking) $("play").click(); }
})();
</script>
</body>
</html>

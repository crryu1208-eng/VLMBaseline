[project]
name = "vlmbaseline"
version = "0.0.1"
description = "Spatial intelligence on 3D scene graphs: question answering, guidance and task suggestions with a VLM"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
tts = ["supertonic", "onnxruntime"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vlmbaseline*"]
